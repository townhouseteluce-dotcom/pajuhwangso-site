<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 검수</title>
<style>
  body{margin:0;background:#222;display:flex;justify-content:center;align-items:flex-start;font-family:sans-serif}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
</style>
</head>
<body>
<iframe id="f" src="https://pajuhwangso.co.kr/"></iframe>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      var l = d.querySelector('link[rel=stylesheet]');
      if (l) {
        var n = d.createElement('link');
        n.rel = 'stylesheet';
        n.href = l.href + '?v=' + Date.now();
        l.replaceWith(n);
      }
    } catch (e) {}
  });
</script>
</body>
</html>
