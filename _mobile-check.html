<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 검수</title>
<style>
  body{margin:0;background:#222;display:flex;justify-content:center;align-items:flex-start;font-family:sans-serif}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
</style>
</head>
<body>
<iframe id="f" src="https://pajuhwangso.co.kr/"></iframe>
<script>
  var target = new URLSearchParams(location.search).get('s') || '';
  function fix() {
    try {
      var d = document.getElementById('f').contentDocument;
      var l = d && d.querySelector('link[rel=stylesheet]');
      if (!l) return setTimeout(fix, 120);
      if (!l.getAttribute('data-fixed')) {
        var n = d.createElement('link');
        n.rel = 'stylesheet';
        n.href = l.href + '?v=' + Date.now();
        n.setAttribute('data-fixed', '1');
        l.replaceWith(n);
        document.title = '모바일 검수 (css refreshed)';
        setTimeout(fix, 900);
        return;
      }
      if (target) {
        var el = d.getElementById(target) || d.querySelector('.' + target);
        if (el) el.scrollIntoView({ block: 'start' });
      }
    } catch (e) { setTimeout(fix, 200); }
  }
  setTimeout(fix, 400);
</script>
</body>
</html>
